[package]
name = "bob-baixa"
version = "0.5.0"
edition = "2021"
publish = false
description = "bob baixa"

[lib]
name = "bob_baixa"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "bob-baixa"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bob-core = { path = "../crates/bob-core" }
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "blocking", "json"] }
futures-util = "0.3"
zip = "2"
dirs = "6"
chrono = { version = "0.4", features = ["clock"] }
arboard = "3"
tiny_http = "0.12"
window-vibrancy = "0.6"
minisign-verify = "0.3"
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
keyring = "3"
windows = { version = "0.62", features = [
    "Foundation",
    "Media",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_WinRT",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
