name: bob baixa installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: install nsis
        run: choco install nsis -y
      - name: npm
        run: npm ci
      - name: build the windows exe
        env:
          BOB_GOOGLE_CLIENT_ID: ${{ secrets.BOB_GOOGLE_CLIENT_ID }}
          BOB_GOOGLE_CLIENT_SECRET: ${{ secrets.BOB_GOOGLE_CLIENT_SECRET }}
          BOB_DISCORD_APP_ID: ${{ secrets.BOB_DISCORD_APP_ID }}
        run: npm run tauri build -- --no-bundle
      - name: installer
        working-directory: packaging
        shell: pwsh
        run: |
          $env:Path = "${env:ProgramFiles(x86)}\NSIS;" + $env:Path
          makensis /DEXE=..\target\release\bob-baixa.exe /DEXTDIR=..\extension /DICON=..\src-tauri\icons\icon.ico bob-baixa.nsi
      - name: release notes from the changelog
        shell: bash
        run: node scripts/write-release-notes.mjs
      - name: sign and write the update manifest
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "segredo TAURI_SIGNING_PRIVATE_KEY ausente. a atualização não pode ser assinada."
            echo "esse segredo é a chave privada que corresponde a packaging/updater.pub e a plugins.updater.pubkey em src-tauri/tauri.conf.json."
            echo "se a chave privada se perdeu, gere outro par com: npx tauri signer generate -w packaging/updater.key -f"
            echo "guarde o conteúdo privado no segredo TAURI_SIGNING_PRIVATE_KEY."
            echo "se o gerador pediu senha, guarde em TAURI_SIGNING_PRIVATE_KEY_PASSWORD."
            echo "substitua packaging/updater.pub e plugins.updater.pubkey pela nova chave pública."
            exit 1
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
            unset TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          fi
          npx tauri signer sign packaging/bob-baixa-setup.exe
          node scripts/write-latest-json.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: bob-baixa-setup
          path: packaging/bob-baixa-setup.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: bob-baixa-latest-json
          path: packaging/latest.json
          if-no-files-found: ignore
      - name: publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: packaging/release-notes.md
          files: |
            packaging/bob-baixa-setup.exe
            packaging/latest.json
          fail_on_unmatched_files: false
