<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#161616" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="bob baixa" />
    <title>bob baixa</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: #161616;
        color: #f4f4f1;
        font: 16px/1.4 "Segoe UI", sans-serif;
      }
      main {
        max-width: 480px;
        margin: 0 auto;
        padding: calc(28px + env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom));
      }
      h1 { font-size: 28px; font-weight: 560; letter-spacing: -0.04em; margin: 0; }
      p.sub { color: #9a9a94; margin: 8px 0 24px; }
      button { font: inherit; }
      .go, .ghost {
        width: 100%;
        min-height: 48px;
        border: 0;
        border-radius: 999px;
        background: #f4f4f1;
        color: #161616;
      }
      .ghost { margin-top: 12px; background: transparent; color: #f4f4f1; border: 1px solid #3a3a3a; }
      .art { width: 100%; aspect-ratio: 1; border-radius: 28px; background: #242424 center/cover; margin: 8px 0 16px; }
      .title { font-size: 22px; letter-spacing: -0.03em; }
      .artist { color: #9a9a94; margin-top: 4px; min-height: 1.2em; }
      audio { width: 100%; margin: 18px 0 8px; }
      .row { display: flex; gap: 12px; }
      .row button { flex: 1; min-height: 48px; border: 0; border-radius: 999px; background: #242424; color: inherit; }
      ul { list-style: none; padding: 0; margin: 18px 0 0; }
      li { border-top: 1px solid #2c2c2c; }
      li button { width: 100%; min-height: 48px; background: none; border: 0; color: inherit; text-align: left; padding: 12px 0; }
      .lyric { white-space: pre-wrap; color: #c8c8c2; margin-top: 18px; }
      .err { color: #ffb4a8; min-height: 1.2em; }
    </style>
  </head>
  <body>
    <main>
      <h1>bob baixa</h1>
      <p class="sub" id="sub">a mesma biblioteca do drive, no celular.</p>
      <section id="gate">
        <button class="go" id="signin" type="button">entrar com google</button>
        <button class="ghost" id="install" type="button" hidden>instalar</button>
        <p class="err" id="err"></p>
      </section>
      <section id="player" hidden>
        <div class="art" id="art"></div>
        <div class="title" id="title">—</div>
        <div class="artist" id="artist"></div>
        <audio id="audio" controls playsinline></audio>
        <div class="row">
          <button id="prev" type="button">anterior</button>
          <button id="next" type="button">próxima</button>
        </div>
        <div class="lyric" id="lyric"></div>
        <ul id="list"></ul>
      </section>
    </main>
    <script src="https://accounts.google.com/gsi/client" async></script>
    <script src="./config.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
