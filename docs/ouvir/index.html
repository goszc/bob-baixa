<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101010" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="A biblioteca do bob baixa no celular." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="bob baixa" />
    <title>bob baixa</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="apple-touch-startup-image" href="./icons/icon-512.png" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #101010;
        --surface: #181818;
        --ink: #f3f3f1;
        --muted: #b5b5b0;
        --line: #2a2a2a;
        --fill: #f3f3f1;
        --onfill: #101010;
        --accent: #8d8d88;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; overflow-x: hidden; background: var(--bg); color: var(--ink); }
      body {
        min-height: 100dvh;
        font: 16px/1.35 "Segoe UI", system-ui, sans-serif;
        padding-bottom: calc(148px + env(safe-area-inset-bottom));
      }
      button, input { font: inherit; color: inherit; }
      button { cursor: pointer; }
      :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
      [hidden] { display: none !important; }
      html.is-waiting #signin { display: none !important; }
      html.is-waiting #waiting { display: block !important; }
      main {
        width: min(100%, 720px);
        margin: 0 auto;
        padding: calc(12px + env(safe-area-inset-top)) 20px 24px;
      }
      header { display: flex; align-items: center; justify-content: space-between; min-height: 44px; }
      h1 { font-size: 22px; font-weight: 620; letter-spacing: -0.04em; margin: 0; }
      #version { background: none; border: 0; color: var(--muted); font-size: 13px; min-width: 44px; min-height: 44px; }
      #err { color: #ffb4a8; margin: 4px 0 8px; }
      #err:empty { display: none; }
      .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
      #gate {
        min-height: calc(100dvh - 120px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 8px;
        padding: 24px 8px 48px;
      }
      html.has-session #gate { display: none; }
      .mark { width: 96px; height: 96px; border-radius: 28px; margin-bottom: 8px; }
      #gate h2 { font-size: 28px; letter-spacing: -0.04em; margin: 0; font-weight: 620; }
      #gate .lead { color: var(--muted); margin: 0 0 16px; max-width: 280px; }
      .go, .ghost {
        width: min(100%, 320px);
        min-height: 48px;
        border: 0;
        border-radius: 999px;
        background: var(--fill);
        color: var(--onfill);
      }
      .ghost { margin-top: 8px; background: transparent; color: var(--ink); border: 1px solid var(--line); }
      #waiting { display: flex; align-items: center; gap: 10px; color: var(--muted); min-height: 48px; }
      .spin {
        width: 18px; height: 18px; border-radius: 50%;
        border: 2px solid var(--line); border-top-color: var(--ink);
        animation: spin 0.8s linear infinite;
      }
      #player { display: none; }
      html.has-session #player { display: block; }
      .tabs-bar {
        position: fixed; z-index: 25; left: 0; right: 0; bottom: 0;
        display: flex; gap: 2px; justify-content: space-between;
        padding: 4px 6px calc(6px + env(safe-area-inset-bottom));
        background: #141414; border-top: 1px solid var(--line);
      }
      .tabs-bar button {
        flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 2px; min-height: 52px; padding: 2px 0; background: none; border: 0; color: var(--muted); font-size: 10px; line-height: 1.1;
      }
      .tabs-bar button[aria-current="page"] { color: var(--ink); }
      .tabs-bar .count { font-variant-numeric: tabular-nums; }
      .pair { display: flex; gap: 8px; }
      .pair button { flex: 1; min-height: 44px; border: 0; border-radius: 999px; background: var(--surface); color: var(--ink); }
      .pair button[aria-pressed="true"] { background: var(--fill); color: var(--onfill); }
      #linkbox { width: 100%; min-height: 48px; margin-top: 8px; border: 0; border-radius: 16px; background: var(--surface); color: var(--ink); padding: 0 14px; }
      .views button, .segments button, .tabs button { background: none; border: 0; color: var(--muted); min-height: 44px; padding: 0; }
      .views button[aria-current="page"], .segments button[aria-selected="true"], .tabs button[aria-selected="true"] { color: var(--ink); font-weight: 620; }
      .segments {
        display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: var(--surface); margin-bottom: 12px;
      }
      .segments { overflow-x: auto; }
      .segments button { flex: 1 0 auto; border-radius: 999px; font-size: 13px; padding: 0 12px; white-space: nowrap; }
      .segments button[aria-selected="true"] { background: var(--fill); color: var(--onfill); }
      input[type="search"] {
        width: 100%; max-width: 100%; min-height: 44px; border-radius: 999px;
        border: 1px solid var(--line); background: var(--surface); padding: 0 16px; margin-bottom: 8px;
      }
      .hero, .rail button, #list button, .grid button, #queue button {
        transition: transform 160ms ease, opacity 160ms ease;
      }
      button:active { transform: scale(0.98); }
      .hero {
        display: block; width: 100%; text-align: left; background: none; border: 0; padding: 0; margin: 0 0 22px;
      }
      .hero .art, .rail img, .rail span.thumb, .grid img, .grid span.thumb, .thumb {
        background: var(--surface); object-fit: cover; display: block; border: 0;
      }
      .hero .art { width: 100%; aspect-ratio: 1; max-height: 420px; border-radius: 28px; }
      .kicker { color: var(--muted); font-size: 13px; margin: 0 0 8px; }
      .hero strong { display: block; margin-top: 12px; font-size: 22px; letter-spacing: -0.03em; font-weight: 620; }
      .hero small, .meta small, .grid small { color: var(--muted); font-size: 14px; }
      .home-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; }
      .home-grid button { display: block; background: none; border: 0; padding: 0; text-align: left; min-width: 0; overflow: hidden; }
      .home-grid img.thumb, .home-grid span.thumb { width: 100%; height: auto; aspect-ratio: 1; border-radius: 16px; display: block; object-fit: cover; background: var(--surface); flex: none; }
      .home-grid strong { display: block; margin-top: 8px; font-size: 14px; font-weight: 560; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .home-grid small { display: block; margin-top: 2px; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .rail { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; scroll-snap-type: x mandatory; }
      .rail button {
        width: 148px; flex: 0 0 auto; scroll-snap-align: start; background: none; border: 0; padding: 0; text-align: left;
      }
      .rail img, .grid img { width: 100%; aspect-ratio: 1; border-radius: 16px; }
      .rail strong, .grid strong, .meta strong { display: block; font-size: 14px; font-weight: 560; margin-top: 8px; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      .grid button { background: none; border: 0; padding: 0; text-align: left; }
      #list, #queue { list-style: none; padding: 0; margin: 0; }
      #list button, #queue button {
        display: flex; align-items: center; gap: 12px; width: 100%; min-height: 64px;
        background: none; border: 0; text-align: left; padding: 6px 0;
      }
      .thumb { width: 48px; height: 48px; border-radius: 10px; flex: 0 0 auto; }
      .meta { min-width: 0; }
      .meta strong, .meta small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #list button[aria-current="true"] strong { color: var(--ink); }
      .bone { height: 64px; border-radius: 12px; background: var(--surface); margin: 8px 0; animation: pulse 1.1s ease-in-out infinite; }
      #pull { height: 0; overflow: hidden; color: var(--muted); font-size: 13px; text-align: center; }
      #sheet {
        position: fixed; inset: 0; z-index: 30; background: #0c0c0c; color: var(--ink);
        transform: translateY(110%);
        transition: transform 320ms cubic-bezier(.2,.8,.2,1);
        overflow: auto; overflow-x: hidden;
        padding: calc(8px + env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom));
      }
      body.sheet { overflow: hidden; }
      body.sheet #sheet { transform: translateY(0); }
      #wash, #wash-img {
        position: absolute; left: -8%; right: -8%; top: -8%; height: 58%;
        object-fit: cover; pointer-events: none;
      }
      #wash { background: var(--accent); filter: blur(50px); opacity: 0.45; }
      #wash-img { width: 116%; opacity: 0.38; filter: blur(46px); transform: scale(1.08); }
      #sheet > *:not(#wash):not(#wash-img):not(#close) { position: relative; }
      #grab { display: grid; place-items: center; height: 28px; background: none; border: 0; width: 100%; }
      #grab span { width: 40px; height: 4px; border-radius: 99px; background: #4a4a4a; }
      #sheet > #close { position: absolute; z-index: 3; right: 8px; top: calc(4px + env(safe-area-inset-top)); width: 44px; height: 44px; border: 0; border-radius: 99px; background: transparent; font-size: 22px; }
      .stage {
        width: min(100%, 420px); aspect-ratio: 1; margin: 8px auto 18px; border-radius: 28px;
        overflow: hidden; background: var(--surface); position: relative; touch-action: none;
      }
      .stage img, .stage video { width: 100%; height: 100%; object-fit: cover; display: block; background: #000; border: 0; }
      .stage video { object-fit: contain; }
      .now { display: flex; align-items: center; gap: 8px; }
      #title { font-size: 22px; letter-spacing: -0.03em; font-weight: 620; flex: 1; min-width: 0; }
      #artist { color: var(--muted); margin-top: 2px; }
      #like, .row button { width: 44px; height: 44px; border: 0; border-radius: 99px; background: transparent; display: grid; place-items: center; }
      #like[aria-pressed="true"] { color: #ff6b81; }
      .row { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 12px; }
      .row button.main { width: 64px; height: 64px; background: var(--fill); color: var(--onfill); }
      input[type="range"] { width: 100%; max-width: 100%; accent-color: var(--ink); height: 28px; }
      .time { display: flex; justify-content: space-between; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }
      .tabs { display: flex; gap: 20px; margin-top: 8px; }
      #lyric { margin-top: 12px; padding-bottom: 24vh; }
      #lyric button {
        display: block; width: 100%; text-align: left; background: none; border: 0;
        color: var(--muted); font-size: 20px; line-height: 1.25; padding: 10px 0;
        opacity: 0.38; filter: blur(0.6px); transform: translateY(0);
        transition: transform 280ms ease, opacity 280ms ease, filter 280ms ease;
      }
      #lyric button[aria-current="true"] {
        color: var(--ink); font-size: 28px; letter-spacing: -0.03em; opacity: 1; filter: none; font-weight: 620;
      }
      #sheet.lyrics { display: grid; grid-template-columns: 64px minmax(0, 1fr); align-content: start; column-gap: 12px; }
      #sheet.lyrics #wash, #sheet.lyrics #wash-img { grid-column: 1 / -1; grid-row: 1 / -1; height: 120%; top: -8%; }
      #sheet.lyrics #grab, #sheet.lyrics .row, #sheet.lyrics #seek, #sheet.lyrics #time, #sheet.lyrics .tabs, #sheet.lyrics #lyric, #sheet.lyrics #queue { grid-column: 1 / -1; }
      #sheet.lyrics #stage { grid-column: 1; width: 64px; height: 64px; aspect-ratio: auto; margin: 0; border-radius: 14px; }
      #sheet.lyrics .now { grid-column: 2; align-self: center; margin: 0; }
      #sheet.lyrics #title { font-size: 15px; }
      #sheet.lyrics .row { margin-top: 8px; }
      #sheet.lyrics .row button.main { width: 52px; height: 52px; }
      #sheet.lyrics #lyric { padding: 12px 4px 28vh; }
      #sheet.lyrics #lyric button { font-size: 26px; font-weight: 620; letter-spacing: -0.04em; padding: 12px 0; }
      #sheet.lyrics #lyric button[aria-current="true"] { font-size: 36px; font-weight: 700; transform: scale(1.03); transform-origin: left center; }
      #lyric button .said { color: var(--ink); }
      #lyric button[aria-current="true"] .said { color: var(--ink); }
      #queue button { border-top: 1px solid var(--line); }
      .handle { width: 18px; color: var(--muted); }
      #mini {
        position: fixed; z-index: 20; left: 12px; right: 12px;
        bottom: calc(68px + env(safe-area-inset-bottom));
        display: flex; align-items: center; gap: 12px; min-height: 64px;
        padding: 8px 8px 8px 10px; border-radius: 18px; background: #242424;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      }
      #mini[hidden] { display: none !important; }
      #mini-cover { width: 48px; height: 48px; border-radius: 10px; object-fit: cover; background: var(--surface); }
      #mini strong { display: block; font-weight: 600; }
      #mini-artist { color: var(--muted); font-size: 13px; }
      #mini-toggle { width: 44px; height: 44px; border: 0; border-radius: 99px; background: var(--fill); color: var(--onfill); display: grid; place-items: center; }
      body.sheet #mini { transform: translateY(140%); }
      #debug {
        white-space: pre-wrap; margin-top: 16px; padding: 12px; border-radius: 16px;
        background: var(--surface); color: var(--muted); font-size: 13px;
      }
      audio { position: absolute; width: 1px; height: 1px; opacity: 0; }
      @media (min-width: 980px) {
        body { height: 100dvh; overflow: hidden; padding: 0; }
        main {
          max-width: 1120px; height: 100dvh; display: grid;
          grid-template-columns: minmax(0, 1fr) 400px; column-gap: 28px; align-items: start;
        }
        header, #err, #gate { grid-column: 1 / -1; }
        html.has-session #player { display: contents; }
        #home, #library { min-width: 0; max-height: calc(100dvh - 72px); overflow: auto; }
        #sheet {
          position: sticky; top: 12px; transform: none; height: calc(100dvh - 24px);
          border-radius: 28px; overflow: auto;
        }
        #mini { display: none; }
        body.sheet #mini { display: none; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation: none !important; transition: none !important;
        }
        #lyric button { filter: none; }
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pulse { 50% { opacity: 0.45; } }
      @keyframes drift { to { transform: scale(1.16) translate3d(0, -2%, 0); } }
      @media (prefers-reduced-motion: no-preference) {
        #wash-img { animation: drift 18s ease-in-out infinite alternate; }
      }
    </style>
  </head>
  <body>
    <script>
      try {
        var exp = Number(localStorage.getItem("bob-exp") || 0)
        var access = localStorage.getItem("bob-access")
        var hint = localStorage.getItem("bob-hint")
        if (access && exp > Date.now() + 15000) document.documentElement.classList.add("has-session")
        else if (access || hint) document.documentElement.classList.add("is-waiting")
      } catch (e) {}
    </script>
    <main>
      <header>
        <h1>bob baixa</h1>
        <button id="version" type="button">0.6.7</button>
      </header>
      <p class="err" id="err" role="status"></p>
      <section id="gate">
        <img class="mark" src="./icons/icon-192.png" alt="" width="96" height="96" />
        <h2>ouça a sua biblioteca</h2>
        <p class="lead">as mesmas faixas, capas e letras do computador.</p>
        <p id="waiting" hidden><span class="spin" aria-hidden="true"></span> entrando…</p>
        <button class="go" id="signin" type="button">entrar com google</button>
        <button class="ghost" id="install" type="button" hidden>instalar</button>
      </section>
      <section id="player">
        <nav class="tabs-bar" aria-label="seções">
          <button type="button" data-view="home" aria-current="page" aria-label="Início"><span data-ico="home"></span>Início</button>
          <button type="button" data-view="likes" aria-label="Curtidas"><span data-ico="heart"></span>Curtidas <span id="like-count" class="count">0</span></button>
          <button type="button" data-view="library" aria-label="Biblioteca"><span data-ico="library"></span>Biblioteca</button>
          <button type="button" data-view="discover" aria-label="Descobrir"><span data-ico="discover"></span>Descobrir</button>
          <button type="button" data-view="download" aria-label="Baixar"><span data-ico="download"></span>Baixar</button>
          <button type="button" data-view="playlists" aria-label="Playlists"><span data-ico="list"></span>Playlists</button>
        </nav>
        <div id="pull" aria-hidden="true"></div>
        <section id="home" aria-label="início"></section>
        <section id="likes" hidden aria-label="curtidas"></section>
        <section id="download" hidden aria-label="baixar">
          <p class="lead">cole um link do youtube.</p>
          <input id="linkbox" type="url" placeholder="https://youtu.be/…" aria-label="link" />
          <div class="pair" style="margin-top:12px">
            <button type="button" id="fmt-mp3" aria-pressed="true">MP3</button>
            <button type="button" id="fmt-mp4" aria-pressed="false">MP4</button>
          </div>
          <button class="go" id="link-go" type="button" style="margin-top:12px">Baixar</button>
          <p id="link-note" class="lead"></p>
        </section>
        <section id="discover" hidden aria-label="descobrir">
          <p class="lead">a partir do que está tocando e do que você mais ouve.</p>
          <div class="pair">
            <button type="button" id="discover-one">Descobrir música</button>
            <button type="button" id="discover-mix">Descobrir mix</button>
          </div>
          <p id="discover-note" class="lead"></p>
        </section>
        <section id="library" hidden aria-label="biblioteca">
          <div class="segments" role="tablist" aria-label="biblioteca">
            <button type="button" data-seg="tracks" role="tab" aria-selected="true">Faixas</button>
            <button type="button" data-seg="artists" role="tab" aria-selected="false">Artistas</button>
            <button type="button" data-seg="albums" role="tab" aria-selected="false">Álbuns</button>
            <button type="button" data-seg="playlists" role="tab" aria-selected="false">Playlists</button>
          </div>
          <input id="search" type="search" placeholder="buscar" aria-label="buscar" />
          <div id="bones" hidden>
            <div class="bone"></div><div class="bone"></div><div class="bone"></div><div class="bone"></div><div class="bone"></div><div class="bone"></div>
          </div>
          <div id="groups"></div>
          <ul id="list"></ul>
        </section>
        <section id="sheet" aria-label="agora tocando">
          <div id="wash"></div>
          <img id="wash-img" alt="" />
          <button id="grab" type="button" aria-label="arrastar para fechar"><span></span></button>
          <button id="close" type="button" aria-label="fechar">×</button>
          <div class="stage" id="stage">
            <img id="cover" alt="" />
            <video id="video" playsinline hidden></video>
          </div>
          <div class="now">
            <div style="flex:1;min-width:0">
              <div class="title" id="title"></div>
              <div class="artist" id="artist"></div>
            </div>
            <button id="like" type="button" aria-label="curtir" aria-pressed="false"></button>
          </div>
          <div class="row">
            <button id="shuffle" type="button" aria-label="aleatório" aria-pressed="false"></button>
            <button id="prev" type="button" aria-label="anterior"></button>
            <button id="toggle" class="main" type="button" aria-label="tocar"></button>
            <button id="next" type="button" aria-label="próxima"></button>
            <button id="repeat" type="button" aria-label="repetir" aria-pressed="false"></button>
          </div>
          <input id="seek" type="range" min="0" max="1000" value="0" aria-label="posição" />
          <div class="time" id="time"><span>0:00</span><span>0:00</span></div>
          <div class="tabs" role="tablist" aria-label="faixa">
            <button type="button" data-tab="queue" role="tab" aria-selected="false">Fila</button>
            <button type="button" data-tab="lyrics" role="tab" aria-selected="false">Letra</button>
          </div>
          <div class="lyric" id="lyric" hidden></div>
          <div id="queue" hidden></div>
          <p class="sr" id="status"></p>
        </section>
        <div id="mini">
          <img id="mini-cover" alt="" />
          <div style="flex:1;min-width:0">
            <strong id="mini-title">bob baixa</strong>
            <div id="mini-artist"></div>
          </div>
          <button id="mini-toggle" type="button" aria-label="tocar ou pausar"></button>
        </div>
        <div id="debug" hidden></div>
      </section>
      <audio id="audio" preload="none"></audio>
    </main>
    <script src="https://accounts.google.com/gsi/client" async></script>
    <script src="./config.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
