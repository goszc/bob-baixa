<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101010" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="bob baixa" />
    <title>bob baixa</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #101010;
        --surface: #181818;
        --ink: #f3f3f1;
        --muted: #9c9c98;
        --line: #2a2a2a;
        --fill: #f3f3f1;
        --onfill: #101010;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font: 16px/1.4 "Segoe UI", system-ui, sans-serif;
      }
      button, input { font: inherit; color: inherit; }
      main {
        max-width: 480px;
        margin: 0 auto;
        padding: calc(16px + env(safe-area-inset-top)) 20px calc(92px + env(safe-area-inset-bottom));
      }
      .top { display: flex; align-items: baseline; justify-content: space-between; }
      h1 { font-size: 22px; font-weight: 560; letter-spacing: -0.04em; margin: 0; }
      #version { background: none; border: 0; color: var(--muted); font-size: 13px; padding: 8px; }
      .sub, .status, .artist, .time { color: var(--muted); }
      .sub { margin: 6px 0 12px; }
      .err { color: #ffb4a8; min-height: 1.2em; }
      .go, .ghost {
        width: 100%;
        min-height: 48px;
        border: 0;
        border-radius: 999px;
        background: var(--fill);
        color: var(--onfill);
      }
      .ghost { margin-top: 12px; background: transparent; color: var(--ink); border: 1px solid var(--line); }
      .stage {
        position: relative;
        width: min(100%, 360px);
        aspect-ratio: 1;
        border-radius: 28px;
        background: var(--surface);
        overflow: hidden;
        margin: 8px auto 16px;
      }
      .stage img, .stage video { width: 100%; height: 100%; object-fit: cover; display: block; background: var(--surface); }
      .stage video { object-fit: contain; background: #000; }
      .now { display: flex; align-items: center; gap: 8px; }
      .title { font-size: 22px; letter-spacing: -0.03em; flex: 1; min-width: 0; }
      #like { width: 40px; height: 40px; border: 0; border-radius: 999px; background: transparent; }
      #like[aria-pressed="true"] { color: #ff6b81; }
      .row { display: flex; align-items: center; justify-content: center; gap: 4px; margin-top: 8px; }
      .row button { width: 44px; height: 44px; border: 0; border-radius: 999px; background: transparent; }
      .row button.main { width: 56px; height: 56px; background: var(--fill); color: var(--onfill); }
      input[type="range"] { width: 100%; accent-color: var(--ink); }
      .time { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; font-size: 13px; }
      .tabs { display: flex; gap: 16px; margin: 18px 0 8px; }
      .tabs button { background: none; border: 0; color: var(--muted); padding: 8px 0; }
      .tabs button[aria-selected="true"] { color: var(--ink); }
      input[type="search"] {
        width: 100%;
        min-height: 44px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: var(--surface);
        padding: 0 16px;
      }
      ul { list-style: none; padding: 0; margin: 8px 0 0; }
      li button, #queue button, .lyric button {
        display: block;
        width: 100%;
        min-height: 48px;
        background: none;
        border: 0;
        text-align: left;
        padding: 12px 0;
        border-top: 1px solid var(--line);
      }
      li button[aria-current="true"], .lyric button[aria-current="true"] { font-weight: 600; }
      .lyric button { color: var(--muted); border: 0; }
      .lyric button[aria-current="true"] { color: var(--ink); font-size: 18px; }
      #queue[hidden], #debug[hidden], #gate[hidden], #player[hidden], #install[hidden], video[hidden] { display: none; }
      #debug {
        white-space: pre-wrap;
        margin-top: 12px;
        padding: 12px;
        border-radius: 16px;
        background: var(--surface);
        color: var(--muted);
        font-size: 13px;
      }
      #mini {
        position: fixed;
        left: 12px;
        right: 12px;
        bottom: calc(12px + env(safe-area-inset-bottom));
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 64px;
        padding: 8px 8px 8px 14px;
        border-radius: 18px;
        background: var(--surface);
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
      }
      #player:not(.sheet) #mini { }
      #mini strong { display: block; font-weight: 560; }
      #mini-artist { color: var(--muted); font-size: 13px; }
      #mini-toggle { width: 44px; height: 44px; border: 0; border-radius: 999px; background: var(--fill); color: var(--onfill); }
      audio { position: absolute; width: 1px; height: 1px; opacity: 0; }
      body.sheet main { padding-bottom: 24px; }
      body.sheet #mini { display: none; }
    </style>
  </head>
  <body>
    <main>
      <div class="top">
        <h1>bob baixa</h1>
        <button id="version" type="button">0.6.5</button>
      </div>
      <p class="sub" id="sub">a mesma biblioteca do drive, no celular.</p>
      <p class="err" id="err" role="status"></p>
      <section id="gate">
        <button class="go" id="signin" type="button">entrar com google</button>
        <button class="ghost" id="install" type="button" hidden>instalar</button>
      </section>
      <section id="player" hidden>
        <p class="status" id="status"></p>
        <div class="stage">
          <img id="cover" alt="" />
          <video id="video" playsinline hidden></video>
        </div>
        <div class="now">
          <div class="title" id="title">—</div>
          <button id="like" type="button" aria-label="curtir" aria-pressed="false">♡</button>
        </div>
        <div class="artist" id="artist"></div>
        <div class="row">
          <button id="shuffle" type="button" aria-label="aleatório">⇄</button>
          <button id="prev" type="button" aria-label="anterior">⏮</button>
          <button id="toggle" class="main" type="button" aria-label="tocar">▶</button>
          <button id="next" type="button" aria-label="próxima">⏭</button>
          <button id="repeat" type="button" aria-label="repetir">↻</button>
        </div>
        <input id="seek" type="range" min="0" max="1000" value="0" aria-label="posição" />
        <div class="time" id="time">0:00 / 0:00</div>
        <div class="tabs" role="tablist">
          <button type="button" data-tab="library" role="tab" aria-selected="true">Biblioteca</button>
          <button type="button" data-tab="queue" role="tab" aria-selected="false">Fila</button>
          <button type="button" data-tab="lyrics" role="tab" aria-selected="false">Letra</button>
        </div>
        <input id="search" type="search" placeholder="buscar" aria-label="buscar" />
        <div class="lyric" id="lyric"></div>
        <div id="queue" hidden></div>
        <ul id="list"></ul>
        <div id="debug" hidden></div>
        <div id="mini">
          <div style="flex:1;min-width:0">
            <strong id="mini-title">bob baixa</strong>
            <div id="mini-artist"></div>
          </div>
          <button id="mini-toggle" type="button" aria-label="tocar ou pausar">▶</button>
        </div>
      </section>
      <audio id="audio" preload="none"></audio>
    </main>
    <script src="https://accounts.google.com/gsi/client" async></script>
    <script src="./config.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
